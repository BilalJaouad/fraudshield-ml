name: FraudShield lightweight checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install lightweight test dependency
        run: python -m pip install 'numpy>=1.26,<3'
      - name: Check source syntax
        run: python -m py_compile streamlit_app.py fraudshield_demo.py api/inference.py
      - name: Run synthetic-data and economics tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
